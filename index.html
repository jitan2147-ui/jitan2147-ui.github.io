<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Study Hub — JAC Board Class 9 & 10</title>
  <style>
    :root {
      --bg: #080d1a;
      --surface: #0f172a;
      --card: #131e36;
      --border: #1e2d4d;
      --text: #f8fafc;
      --muted: #94a3b8;
      --gold: #d4af37;
      --gold-bright: #eab308;
      --gold-text: #0f172a;
      --correct: #16a34a;
      --wrong: #dc2626;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, sans-serif;
    }

    body {
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding-bottom: 80px;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 18px;
      background: #0b1120;
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
      z-index: 20;
    }

    .brand {
      font-size: 20px;
      font-weight: 700;
      color: var(--gold);
      letter-spacing: 0.3px;
    }

    .board-pill {
      font-size: 12px;
      background: var(--card);
      border: 1px solid var(--border);
      padding: 5px 11px;
      border-radius: 999px;
      color: var(--muted);
    }

    .container {
      max-width: 640px;
      margin: 0 auto;
      padding: 16px;
    }

    .hero {
      background: linear-gradient(145deg, #16233d, #0d1526);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 24px 18px;
      text-align: center;
      margin-bottom: 18px;
    }

    .hero-tag {
      font-size: 11px;
      letter-spacing: 1.5px;
      color: var(--muted);
      text-transform: uppercase;
      margin-bottom: 8px;
    }

    .hero h1 {
      font-size: 22px;
      margin-bottom: 6px;
      color: var(--text);
    }

    .hero p {
      color: var(--muted);
      font-size: 14px;
      margin-bottom: 16px;
    }

    .hero-btn {
      background: var(--gold-bright);
      color: var(--gold-text);
      border: none;
      padding: 11px 22px;
      border-radius: 999px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
    }

    .section-label {
      font-size: 13px;
      color: var(--muted);
      margin-bottom: 10px;
      font-weight: 600;
    }

    .class-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
      margin-bottom: 18px;
    }

    .class-card {
      background: var(--card);
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: 16px;
      padding: 16px;
      text-align: left;
      cursor: pointer;
      transition: 0.2s;
    }

    .class-card.active {
      border-color: var(--gold-bright);
      background: #1a2847;
    }

    .class-card h3 {
      font-size: 17px;
      margin-bottom: 4px;
      color: var(--gold-bright);
    }

    .class-card span {
      font-size: 12px;
      color: var(--muted);
    }

    .subject-bar {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 18px;
    }

    .sub-pill {
      background: var(--card);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 8px 14px;
      border-radius: 999px;
      font-size: 13px;
      cursor: pointer;
    }

    .sub-pill.active {
      background: var(--gold-bright);
      color: var(--gold-text);
      border-color: var(--gold-bright);
      font-weight: 700;
    }

    .quiz-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 18px;
      margin-bottom: 14px;
    }

    .q-header {
      display: flex;
      justify-content: space-between;
      font-size: 12px;
      color: var(--gold);
      margin-bottom: 10px;
      font-weight: 600;
    }

    .q-title {
      font-size: 17px;
      line-height: 1.5;
      margin-bottom: 14px;
      font-weight: 600;
    }

    .opt-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .opt-item {
      width: 100%;
      text-align: left;
      background: #0c1426;
      border: 1px solid var(--border);
      color: var(--text);
      padding: 12px 14px;
      border-radius: 12px;
      font-size: 15px;
      cursor: pointer;
    }

    .opt-item.correct {
      background: rgba(22, 163, 74, 0.22);
      border-color: var(--correct);
      color: #bbf7d0;
    }

    .opt-item.wrong {
      background: rgba(220, 38, 38, 0.22);
      border-color: var(--wrong);
      color: #fecaca;
    }

    .exp-box {
      margin-top: 12px;
      padding: 11px 13px;
      border-radius: 10px;
      background: #0a101f;
      border-left: 3px solid var(--gold-bright);
      font-size: 13px;
      color: var(--muted);
      line-height: 1.45;
      display: none;
    }

    .nav-row {
      display: flex;
      gap: 10px;
    }

    .nav-btn {
      flex: 1;
      padding: 12px;
      border-radius: 12px;
      border: none;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
    }

    .btn-prev {
      background: var(--card);
      color: var(--text);
      border: 1px solid var(--border);
    }

    .btn-next {
      background: var(--gold-bright);
      color: var(--gold-text);
    }

    .result-card {
      background: var(--card);
      border: 1px solid var(--gold-bright);
      border-radius: 18px;
      padding: 22px;
      text-align: center;
      display: none;
    }

    .result-card h2 {
      color: var(--gold-bright);
      font-size: 22px;
      margin-bottom: 8px;
    }

    .result-card p {
      color: var(--muted);
      font-size: 14px;
      margin-bottom: 16px;
    }
  </style>
</head>
<body>
  <header>
    <div class="brand">Study Hub</div>
    <div class="board-pill">JAC Board • Class 9 & 10</div>
  </header>

  <main class="container">
    <section class="hero">
      <div class="hero-tag">BOARD • CLASS 9 & 10</div>
      <h1>Learn • Practice • Success</h1>
      <p>पढ़ाई वही, जो सफलता तक ले जाए।</p>
      <button class="hero-btn" onclick="scrollToPractice()">पढ़ाई शुरू करें</button>
    </section>

    <div class="section-label">1. अपनी क्लास चुनें</div>
    <div class="class-grid">
      <button class="class-card active" id="card-9" onclick="openClass('9')">
        <h3>Class 9</h3>
        <span>5 विषय • MCQ अभ्यास</span>
      </button>
      <button class="class-card" id="card-10" onclick="openClass('10')">
        <h3>Class 10</h3>
        <span>5 विषय • MCQ अभ्यास</span>
      </button>
    </div>

    <div class="section-label" id="practiceStart">2. विषय चुनें</div>
    <div class="subject-bar" id="subjectBar"></div>

    <div class="quiz-card" id="quizCard">
      <div class="q-header">
        <span id="qBadge"></span>
        <span id="qCount"></span>
      </div>
      <div class="q-title" id="qTitle"></div>
      <div class="opt-list" id="optList"></div>
      <div class="exp-box" id="expBox"></div>
    </div>

    <div class="nav-row" id="navRow">
      <button class="nav-btn btn-prev" onclick="goPrev()">← पिछला</button>
      <button class="nav-btn btn-next" onclick="goNext()">अगला →</button>
    </div>

    <div class="result-card" id="resultCard">
      <h2 id="resTitle"></h2>
      <p id="resSub"></p>
      <button class="hero-btn" onclick="resetSet()">दोबारा अभ्यास करें</button>
    </div>
  </main>
